apiVersion: v1
kind: ConfigMap
metadata:
  name: spider-performance-config
  namespace: spider
  labels:
    app: spider
    component: performance
data:
  performance.yaml: |
    # Performance Configuration
    performance:
      # CPU Optimization
      cpu:
        affinity: true
        cores_per_worker: 2
        max_workers: 8
        worker_class: "uvicorn.workers.UvicornWorker"
      
      # Memory Optimization
      memory:
        max_memory_usage: "4Gi"
        memory_cleanup_interval: 300
        garbage_collection_threshold: 0.8
        cache_size_limit: "2Gi"
      
      # Database Optimization
      database:
        connection_pool_size: 20
        max_overflow: 30
        pool_timeout: 30
        pool_recycle: 3600
        pool_pre_ping: true
        echo: false
      
      # Cache Optimization
      cache:
        redis:
          max_connections: 100
          socket_timeout: 5
          socket_connect_timeout: 5
          retry_on_timeout: true
          health_check_interval: 30
        memcached:
          max_connections: 100
          socket_timeout: 5
          socket_connect_timeout: 5
          retry_on_timeout: true
      
      # HTTP Optimization
      http:
        keep_alive: true
        keep_alive_timeout: 65
        max_keep_alive_requests: 1000
        tcp_keepalive: true
        tcp_keepalive_idle: 600
        tcp_keepalive_interval: 60
        tcp_keepalive_count: 3
      
      # Compression
      compression:
        enabled: true
        level: 6
        min_size: 1024
        content_types: ["text/plain", "text/html", "text/css", "application/json", "application/javascript"]
      
      # Caching
      caching:
        enabled: true
        default_ttl: 3600
        max_ttl: 86400
        cache_control: "public, max-age=3600"
        etag: true
        last_modified: true
      
      # Load Balancing
      load_balancing:
        enabled: true
        algorithm: "round_robin"
        health_check_interval: 30
        health_check_timeout: 5
        max_retries: 3
        retry_timeout: 1
      
      # Monitoring
      monitoring:
        enabled: true
        metrics_interval: 30
        performance_profiling: false
        memory_profiling: false
        cpu_profiling: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-performance-config
  namespace: spider
  labels:
    app: spider
    component: performance
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;
        
        # Basic Settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;
        
        # Gzip Settings
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
        
        # Upstream
        upstream spider_backend {
            least_conn;
            server spider-service:8000 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }
        
        # Main Server
        server {
            listen 80;
            server_name example.com;
            
            # Security Headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            
            # Rate Limiting
            limit_req zone=api burst=20 nodelay;
            
            # Proxy Settings
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            location / {
                proxy_pass http://spider_backend;
            }
            
            location /api/ {
                limit_req zone=api burst=50 nodelay;
                proxy_pass http://spider_backend;
            }
            
            location /auth/ {
                limit_req zone=login burst=5 nodelay;
                proxy_pass http://spider_backend;
            }
            
            location /health {
                access_log off;
                proxy_pass http://spider_backend;
            }
            
            location /metrics {
                access_log off;
                proxy_pass http://spider_backend;
            }
        }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-performance
  namespace: spider
  labels:
    app: spider
    component: performance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spider
      component: nginx
  template:
    metadata:
      labels:
        app: spider
        component: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-performance-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-performance-service
  namespace: spider
  labels:
    app: spider
    component: performance
spec:
  selector:
    app: spider
    component: nginx
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
