apiVersion: apps/v1
kind: Deployment
metadata:
  name: spider-app
  namespace: spider
  labels:
    app: spider
    component: application
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spider
      component: application
  template:
    metadata:
      labels:
        app: spider
        component: application
    spec:
      containers:
      - name: spider-app
        image: spider:2.0.0
        ports:
        - containerPort: 8000
        - containerPort: 9090
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: spider-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: spider-config
              key: REDIS_URL
        - name: MEMCACHED_URL
          valueFrom:
            configMapKeyRef:
              name: spider-config
              key: MEMCACHED_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: spider-secrets
              key: secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: spider-secrets
              key: jwt-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: spider-secrets
              key: aws-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: spider-secrets
              key: aws-secret-key
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: spider-secrets
              key: azure-client-id
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: spider-secrets
              key: azure-client-secret
        - name: GCP_SERVICE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: spider-secrets
              key: gcp-service-account
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: logs-volume
          mountPath: /app/logs
        - name: models-volume
          mountPath: /app/models
      volumes:
      - name: config-volume
        configMap:
          name: spider-config
      - name: logs-volume
        emptyDir: {}
      - name: models-volume
        emptyDir: {}
      initContainers:
      - name: db-migration
        image: spider:2.0.0
        command: ["python", "-m", "alembic", "upgrade", "head"]
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: spider-config
              key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: spider-service
  namespace: spider
  labels:
    app: spider
    component: application
spec:
  selector:
    app: spider
    component: application
  ports:
  - name: api
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spider-hpa
  namespace: spider
  labels:
    app: spider
    component: application
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spider-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
