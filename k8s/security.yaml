apiVersion: v1
kind: NetworkPolicy
metadata:
  name: spider-network-policy
  namespace: spider
  labels:
    app: spider
    component: security
spec:
  podSelector:
    matchLabels:
      app: spider
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: spider
    - podSelector:
        matchLabels:
          app: spider
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9090
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: spider
          component: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: spider
          component: cache
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: spider
          component: memcached
    ports:
    - protocol: TCP
      port: 11211
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: UDP
      port: 53
---
apiVersion: v1
kind: NetworkPolicy
metadata:
  name: spider-database-network-policy
  namespace: spider
  labels:
    app: spider
    component: security
spec:
  podSelector:
