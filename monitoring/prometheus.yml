# Prometheus configuration for SPIDER monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "spider_rules.yml"

scrape_configs:
  # SPIDER application metrics
  - job_name: 'spider'
    static_configs:
      - targets: ['spider:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # SPIDER health check
  - job_name: 'spider-health'
    static_configs:
      - targets: ['spider:8001']
    metrics_path: /health
    scrape_interval: 30s
    scrape_timeout: 5s

  # Node exporter (if available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Redis metrics (if available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 15s

  # PostgreSQL metrics (if available)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
